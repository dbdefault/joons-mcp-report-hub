name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run test suite
        run: node scripts/test.js

      - name: "Smoke: --version"
        run: node bin/joons-mcp-report-hub.js --version

      - name: "Smoke: validate examples"
        run: node bin/joons-mcp-report-hub.js validate examples/reports

      - name: "Smoke: build example dashboard"
        run: node bin/joons-mcp-report-hub.js build examples/reports --out dashboard-out --stable --fail-on none
